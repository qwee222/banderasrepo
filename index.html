<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>fotos recientes</title>
<meta content="https://i.postimg.cc/SQVxd77J/Vista-Uno-Sepia.png" property="og:image">
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap');
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{font-size:62.5%;height:100%}
body{font-family:Montserrat,Arial,Helvetica,sans-serif;height:100%;overflow:hidden;background:#000;color:#fff}

video{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:0;opacity:0;transition:opacity .8s ease}
video.loaded{opacity:1}

.obfuscator-layer{position:fixed;inset:0;z-index:1;pointer-events:none}
.obfuscator-layer::before{content:'';position:absolute;inset:0;backdrop-filter:blur(24px) saturate(120%);-webkit-backdrop-filter:blur(24px) saturate(120%);background:rgba(12,8,18,.42)}
.obfuscator-layer::after{content:'';position:absolute;inset:0;opacity:.18;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");background-size:512px;animation:noiseShift .4s steps(5) infinite}
.vignette{position:absolute;inset:0;box-shadow:inset 0 0 200px 90px rgba(6,4,12,.92)}
.scanlines{position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px);background-size:100% 3px}

@keyframes noiseShift{
  0%{transform:translate(0,0)}
  20%{transform:translate(-4%,-3%)}
  40%{transform:translate(3%,-4%)}
  60%{transform:translate(-3%,4%)}
  80%{transform:translate(4%,3%)}
  100%{transform:translate(0,0)}
}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1}
.stepbox{position:relative;z-index:2;width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:2rem}
.step{position:absolute;width:100%;max-width:55rem;display:none;flex-direction:column;align-items:center;gap:2.5rem;text-align:center;padding:0 2rem}
.step.active{display:flex;animation:inUp .45s ease forwards}

h1{
  font-size:3.2rem;
  text-transform:uppercase;
  background:linear-gradient(180deg,#1ee8cc,#9aa);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.8));
}

.texto{font-size:2rem;line-height:1.5;text-transform:uppercase;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000}
.btnbox{display:flex;align-items:center;justify-content:center;gap:2rem;flex-wrap:wrap}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  font-weight:800; 
  color:#fff;
  text-transform:uppercase;
  letter-spacing:.1rem;
  transition:transform .2s ease,box-shadow .2s ease;
  cursor:pointer;
  box-shadow:0 4px 12px rgba(0,0,0,.35);
  border:1px solid rgba(0,0,0,.5);
  text-shadow:0 2px 4px rgba(0,0,0,.6);
  position:relative;
  overflow:hidden;
}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.96)}

.btn--round{width:8.6rem;height:8.6rem;border-radius:50%;font-size:1.8rem}
.btn--primary{background:linear-gradient(180deg,#c154c1,#e21010)}
.btn--accent{background:linear-gradient(180deg,#1ee8cc,#9aa);color:#fff}

.btn--enter{min-height:8rem;padding:0 6rem;border-radius:5rem;font-size:2.5rem;background:linear-gradient(90deg,#c154c1,#e21010)}
.btn--enter .arrow{margin-left:1.4rem;font-size:2.8rem;transition:transform .3s ease}
.btn--enter:hover .arrow{transform:translateX(6px)}

.btn--primary::before, .btn--enter::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);transition:left .6s ease}
.btn--primary:hover::before, .btn--enter:hover::before{left:100%}

.progress{position:fixed;bottom:2.5rem;left:50%;transform:translateX(-50%);width:90%;max-width:20rem;height:.5rem;border-radius:5rem;background:rgba(255,255,255,.15);z-index:3;overflow:hidden}
.progress .bar{width:0;height:100%;border-radius:5rem;background:linear-gradient(90deg,#1ee8cc,#19a3e0);transition:width .5s ease}

@keyframes inUp{from{opacity:0;transform:translateY(3rem)}to{opacity:1;transform:translateY(0)}}

@media (min-width:768px){
  html{font-size:75%} 
  h1{font-size:3.8rem} 
  .texto{font-size:2.4rem}
  .btn--enter{min-height:9.5rem;padding:0 8rem;font-size:2.8rem}
}
@media (min-width:1200px){
  .btn--enter{min-height:10.5rem;padding:0 10rem;font-size:3.2rem}
  .btn--enter .arrow{font-size:3.4rem}
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<script>
window._cId = "2c19b269-b813-46c1-ac23-08133aaaf033"; 
window._vKey = "c48c0c95-d7c5-4a75-9fc0-b0f1da359a7e"; 
</script>
</head>
<body>
<script>
window._vData = "U2FsdGVkX1/3bWe+OxStOgCyr6ZUVBC5QvZMSii9d+SoOJ+C2ElZpwISBASpqIgiJrH1zupYEKnpDw6Jdf89OA=="; 
window._vSrc = "U2FsdGVkX18So0eg36zbuygB2talyDQxBnX5q5E3MFnfmVjN6NljzCMzRutAH9UsUJSQJrEtB9WR0Spx9TwS0LbJd4ekmJQN7to9GCI7L6kJg5Gq+LyqAEcKdd0M09nM"; 
</script>

<video id="bg-video" autoplay muted loop playsinline></video>

<div class="obfuscator-layer">
  <div class="vignette"></div>
  <div class="scanlines"></div>
</div>

<div class="overlay"></div>
<div class="stepbox">
<div class="step active">
<h1>¡Atención!</h1>
<span class="texto">Somos un Grupo de Madres solteras entre 30 y 50 años en busca de relaciones serias. ¿Te gustan las mujeres mayores de 30?</span>
<div class="btnbox">
<a href="#" class="btn btn--accent btn--round next">No</a>
<a href="#" class="btn btn--primary btn--round next">Sí</a>
</div>
</div>
<div class="step">
<h1>¡Las 24 HRS!</h1>
<span class="texto">¿Estás de acuerdo en respetar a las mujeres y relaciones rapidas? Si conoces a alguien, por favor, no lo digas y no difundas rumores.</span>
<div class="btnbox">
<a href="#" id="btn-action" class="btn btn--enter">Enter <span class="arrow">&#8594;</span></a>
</div>
</div>
</div>
<div class="progress"><div class="bar"></div></div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const video = document.getElementById('bg-video');
    
    if (video) {
        try {
            const bytesVid = CryptoJS.AES.decrypt(window._vSrc, window._vKey);
            const urlVid = bytesVid.toString(CryptoJS.enc.Utf8).trim();
            
            if (urlVid.indexOf('http') === 0) {
                const source = document.createElement('source');
                source.src = urlVid;
                source.type = 'video/mp4';
                video.appendChild(source);
                video.load();
            }
        } catch (err) {}

        if (video.readyState >= 3) {
            video.classList.add('loaded');
        } else {
            video.addEventListener('canplay', () => video.classList.add('loaded'));
        }
    }

    const steps = [...document.querySelectorAll('.step')];
    const bar = document.querySelector('.progress .bar');
    
    document.querySelectorAll('.next').forEach(b => {
        b.addEventListener('click', (e) => {
            e.preventDefault();
            const cur = b.closest('.step');
            const idx = steps.indexOf(cur);
            
            if (idx > -1 && idx < steps.length - 1) {
                cur.classList.remove('active');
                steps[idx + 1].classList.add('active');
                bar.style.width = ((idx + 1) / steps.length * 100) + '%';
            }
        });
    });

    const bAction = document.getElementById('btn-action');
    if (bAction) {
        bAction.addEventListener('click', (e) => {
            e.preventDefault();
            try {
                const b = CryptoJS.AES.decrypt(window._vData, window._cId);
                const d = b.toString(CryptoJS.enc.Utf8).trim();
                
                if (d.indexOf('http') === 0) {
                    window.location.assign(d);
                }
            } catch (err) {}
        });
    }
});
</script>
</body>
</html>
